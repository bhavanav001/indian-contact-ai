<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Indian Contract AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-root"></div>

<div class="auth-shell">
    <div class="card auth-card">
        <div class="auth-title">Welcome back</div>
        <div class="auth-sub">Log in to view and analyze your contracts.</div>

        <div id="alert" class="alert alert-error"></div>

        <form id="login-form">
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-input" placeholder="you@company.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-input" placeholder="••••••••" required>
            </div>
            <button type="submit" id="submit-btn" class="btn btn-primary btn-block btn-lg">Login</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="register.html">Register</a>
        </div>
    </div>
</div>

<div id="footer-root"></div>

<script src="js/api.js"></script>
<script src="js/shared.js"></script>
<script src="js/auth.js"></script>
<script>
    renderNavbar('home');
    renderFooter();
</script>
</body>
</html>
