<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Indian Contract AI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="navbar-root"></div>

<div class="auth-shell">
    <div class="card auth-card">
        <div class="auth-title">Create your account</div>
        <div class="auth-sub">Start analyzing contracts for Indian legal &amp; regulatory risk.</div>

        <div id="alert" class="alert alert-error"></div>
        <div id="success-alert" class="alert alert-success"></div>

        <form id="register-form">
            <div class="form-group">
                <label class="form-label">Full Name</label>
                <input type="text" id="name" class="form-input" placeholder="Your name" required>
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-input" placeholder="you@company.com" required>
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" id="password" class="form-input" placeholder="At least 6 characters" required minlength="6">
            </div>
            <button type="submit" id="submit-btn" class="btn btn-primary btn-block btn-lg">Register</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Login</a>
        </div>
    </div>
</div>

<div id="footer-root"></div>

<script src="js/api.js"></script>
<script src="js/shared.js"></script>
<script src="js/auth.js"></script>
<script>
    renderNavbar('home');
    renderFooter();
</script>
</body>
</html>
